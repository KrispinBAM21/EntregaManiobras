name: Publicar sitio principal y negocios
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar sitio principal
        run: |
          python3 - <<'PY'
          import shutil
          shutil.copytree('.', '_site', ignore=shutil.ignore_patterns('.git', '.github', '_site', 'node_modules', 'upload', 'tests', '__pycache__'))
          PY
      - name: Construir rutas de negocios activos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_OUTPUT: _site
          PLATFORM_WEB: platform/web
        run: python3 platform/scripts/publish.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
